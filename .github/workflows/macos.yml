name: macOS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-traits:
    name: macOS swift build + test (no traits)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Cache SPM
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
          key: ${{ runner.os }}-spm-no-traits-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-no-traits-
      - run: swift --version
      - run: swift build
      - name: swift build (strict concurrency)
        run: swift build -Xswiftc -strict-concurrency=complete
      - run: swift test

  all-traits:
    name: macOS swift test (MLX, CoreML, Llama, FoundationModels)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Cache SPM
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
          key: ${{ runner.os }}-spm-all-traits-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-all-traits-
      - run: swift test --traits MLX,CoreML,Llama,FoundationModels

  apple-platforms:
    name: ${{ matrix.platform }} test
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS, watchOS, visionOS]
    steps:
      - uses: actions/checkout@v7
      - name: Cache SPM
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
          key: ${{ runner.os }}-spm-${{ matrix.platform }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ matrix.platform }}-
      # Runner images don't preinstall every simulator runtime, and
      # -downloadPlatform intermittently fails (exit 70) even when the
      # runtime is already installed — so only download when it's missing.
      - name: Ensure ${{ matrix.platform }} simulator runtime
        run: |
          if xcrun simctl list runtimes | grep -q '^${{ matrix.platform }} '; then
            echo "${{ matrix.platform }} runtime already installed"
          else
            xcodebuild -downloadPlatform ${{ matrix.platform }} -quiet
          fi
      # Simulator inventories vary by image, so resolve a device UDID at run
      # time instead of hardcoding a device name.
      - name: Pick a ${{ matrix.platform }} simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | jq -r '
            .devices
            | to_entries
            | map(select(.key
                | contains("${{ matrix.platform }}")
                  or ("${{ matrix.platform }}" == "visionOS" and contains("xrOS"))))
            | sort_by(.key) | reverse
            | map(.value[]) | first | .udid // empty')
          if [ -z "$UDID" ]; then
            echo "No available ${{ matrix.platform }} simulator after runtime download" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: xcodebuild test (${{ matrix.platform }} Simulator)
        run: |
          xcodebuild test \
            -scheme swift-ai-hub-Package \
            -destination 'platform=${{ matrix.platform }} Simulator,id=${{ steps.sim.outputs.udid }}' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
